<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>고장 난 타임머신</title>
<style>html,body{margin:0;height:100%;background:#04060c;color:#29e6ff;font-family:sans-serif}#boot{display:grid;place-items:center;height:100%;letter-spacing:.3em;font-size:14px}</style></head>
<body><div id="boot">CHRONOS BOOTING…</div>
<script>
(function(){
  var N = 6, v = '20261012';
  var reqs = [];
  for (var i = 1; i <= N; i++) reqs.push(fetch('app/app' + i + '.txt?v=' + v, {cache:'no-cache'}).then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); }));
  Promise.all(reqs).then(function(parts){
    document.open(); document.write(parts.join('')); document.close();
  }).catch(function(e){
    document.getElementById('boot').textContent = '크로노스를 불러오지 못했습니다. 새로고침해 주세요. (' + e.message + ')';
  });
})();
</script>
</body></html>
