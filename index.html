<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>고장 난 타임머신</title>
<style>html,body{margin:0;height:100%;background:#04060c;color:#29e6ff;font-family:sans-serif}#boot{display:grid;place-items:center;height:100%;letter-spacing:.3em;font-size:14px}</style></head>
<body><div id="boot">CHRONOS BOOTING…</div>
<script>
(function(){
  /* 웹앱 본문(app1~6) + 수정본(patch.json)을 합쳐 실행합니다. Firebase 설정은 수정본 안에 들어 있어요. */
  var N = 6, v = '20261012e';
  var get = function(u){ return fetch(u + '?v=' + v, {cache:'no-cache'}).then(function(r){ if (!r.ok) throw new Error(u + ' ' + r.status); return r.text(); }); };
  var reqs = [];
  for (var i = 1; i <= N; i++) reqs.push(get('app/app' + i + '.txt'));
  reqs.push(get('app/patch.json'));
  Promise.all(reqs).then(function(parts){
    var patch = JSON.parse(parts.pop());
    var html = parts.join('');
    if (html.length !== patch.base) throw new Error('본문 길이 불일치 ' + html.length);
    patch.ops.slice().sort(function(a,b){ return b[0] - a[0]; }).forEach(function(o){ html = html.slice(0, o[0]) + o[2] + html.slice(o[0] + o[1]); });
    document.open(); document.write(html); document.close();
  }).catch(function(e){
    document.getElementById('boot').textContent = '크로노스를 불러오지 못했습니다. 새로고침해 주세요. (' + e.message + ')';
  });
})();
</script>
</body></html>
