<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>고장 난 타임머신</title>
<style>html,body{margin:0;height:100%;background:#04060c;color:#29e6ff;font-family:sans-serif}#boot{display:grid;place-items:center;height:100%;letter-spacing:.3em;font-size:14px}</style></head>
<body><div id="boot">CHRONOS BOOTING…</div>
<script>
(function(){
  var N = 6, v = '20261012d';
  /* Firebase 설정 (실시간 연동). 데모 모드로 돌리려면 아래 FIREBASE 줄을 null 로 바꾸세요. */
  var FIREBASE = {
    apiKey: "AIzaSyBAroBBUCnEsOEsCqwCVCxl1slVHsUd7os",
    authDomain: "tech-escape-7c61d.firebaseapp.com",
    projectId: "tech-escape-7c61d",
    storageBucket: "tech-escape-7c61d.firebasestorage.app",
    messagingSenderId: "1019226531075",
    appId: "1:1019226531075:web:7b3ef9c7143f7cd203b536"
  };
  /* 본문 조각에 덧붙이는 작은 수정(문구·자막·설정) */
  var PATCH = [
    ['const FIREBASE_CONFIG = null;', 'const FIREBASE_CONFIG = ' + JSON.stringify(FIREBASE) + ';'],
    ['고개를 저습니다', '고개를 젓습니다'],
    ["subs:[[0.2,'경고. 시내버스 7번 제동 장치 이상.']]", "subs:[[0.2,'경고. 시내버스 7번 제동 장치 이상.'],[3.5,'차내 경보 발생. 브레이크가 반응하지 않습니다.'],[6.8,'전방 횡단보도에 보행자 감지. 충돌까지 4초.']]"],
    ["subs:[[0.2,'전력 저하. 예비 부품이 필요합니다.']]", "subs:[[0.2,'전력 저하. 조종석 패널 과부하.'],[4,'부품 규격이 맞지 않습니다. 크로노스가 버티지 못합니다.'],[7.5,'현재로 비상 귀환. 예비 부품이 필요합니다.']]"],
    ["subs:[[0.3,'지구 반대편 마을에 접근 중.']]", "subs:[[0.3,'지구 반대편 마을에 접근 중.'],[3.5,'전기도, 수리점도 없는 마을입니다.'],[6.5,'마을 사람들은 지금 가진 것으로 살아가고 있습니다.']]"]
  ];
  if (!FIREBASE) PATCH.shift();
  var reqs = [];
  for (var i = 1; i <= N; i++) reqs.push(fetch('app/app' + i + '.txt?v=' + v, {cache:'no-cache'}).then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); }));
  Promise.all(reqs).then(function(parts){
    var html = parts.join('');
    PATCH.forEach(function(p){ html = html.split(p[0]).join(p[1]); });
    document.open(); document.write(html); document.close();
  }).catch(function(e){
    document.getElementById('boot').textContent = '크로노스를 불러오지 못했습니다. 새로고침해 주세요. (' + e.message + ')';
  });
})();
</script>
</body></html>
